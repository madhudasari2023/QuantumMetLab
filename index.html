  else el.querySelector('.map-mount').innerHTML = `<div class="map-leg" style="border:1px solid var(--hair);padding:18px;background:var(--paper2)">This ${s.num===0?'bridge':'mini'} series unlocks alongside Series 01’s drip — the prerequisite map lives on the <a href="#/series/s1">Series 01 page</a>.</div>`;
  return el;
}

function viewChapter(id){
  const ch = CHAP[id];
  if (!ch) return viewHome();
  if (!ch.released) return viewLocked(ch);
  CUR_CH = id;
  $('#ch-progress').style.display = 'block';

  const el = frag(`
  <div class="wrap ch-grid">
    <aside class="ch-aside">
      <a class="crumb" style="padding:26px 0 0" href="#/series/s1">${icon('undo',12)} SERIES 01</a>
      <div class="toc-h">ON THIS PAGE</div>
      <nav class="toc-list" id="toc"></nav>
      <div class="toc-h">SERIES 01 PROGRESS</div>
      <ul class="side-check" id="side-check"></ul>
      <div class="side-note"><b id="ch-pct">0%</b> READ · CHAPTER AUTO-COMPLETES AT 80% SCROLL</div>
    </aside>
    <article class="ch" id="ch-art">
      <div class="kick">SERIES 01 · CHAPTER ${String(ch.num).padStart(2,'0')} OF 07</div>
      <h1 style="font-size:clamp(1.7rem,3vw,2.3rem);margin:16px 0 10px">${ch.title}</h1>
      <p style="color:var(--ink2);font-style:italic;font-size:17.5px;margin-bottom:14px">${ch.sub}</p>
      <div class="mono" style="font:400 10px 'IBM Plex Mono';letter-spacing:.1em;color:var(--ink3);display:flex;gap:18px;flex-wrap:wrap">
        <span>${icon('clock',12)} ${ch.minutes} MIN READ</span><span>MME: ${ch.mme.join(' · ')}</span><span>${ch.updated.toUpperCase()}</span>
      </div>
      <div style="margin-top:18px">${latticeBand(true)}</div>
      <div id="ch-body"></div>
    </article>
  </div>`);
  el.querySelector('#ch-body').innerHTML = CHHTML[id]();
  const toc = el.querySelector('#toc');
  ch.sections.forEach(([sid, label]) => {
    const b = document.createElement('button');
    b.className = 'toc-item'; b.dataset.t = sid;
    b.innerHTML = `<span>${label}</span><span class="tdot"></span>`;
    b.addEventListener('click', () => {
      el.querySelector('#'+sid)?.scrollIntoView({behavior:'smooth', block:'start'});
    });
    toc.appendChild(b);
  });
  const sc = el.querySelector('#side-check');
  sc.innerHTML = Object.values(CHAP).map(c => `
    <li data-ch="${c.id}" class="${DONE.has(c.id)?'done':''}">
      <span class="box">${icon('check',9)}</span>
      <span>CH ${c.num} · ${c.short.toUpperCase()}</span>
    </li>`).join('');

  const art = el.querySelector('#ch-art');
  const pctEl = el.querySelector('#ch-pct');
  const secEls = ch.sections.map(([sid]) => el.querySelector('#'+sid)).filter(Boolean);
  let ticking = false;
  function onScroll(){
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const r = art.getBoundingClientRect();
      const total = art.offsetHeight - innerHeight;
      const p = total > 200 ? clamp(-r.top/total, 0, 1) : 1;
      pctEl.textContent = Math.round(p*100) + '%';
      $('#ch-progress').style.width = (p*100) + '%';
      secEls.forEach((s,i) => {
        if (s.getBoundingClientRect().top < innerHeight*0.45){
          toc.children[i]?.classList.add('passed');
        }
      });
      if (p >= 0.8 && !DONE.has(id)) completeChapter(id);
    });
  }
  onEv(window, 'scroll', onScroll, {passive:true});
  setTimeout(onScroll, 300);

  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting){
        toc.querySelectorAll('.toc-item').forEach(t => t.classList.toggle('on', t.dataset.t === en.target.id));
      }
    });
  }, { rootMargin:'-25% 0px -65% 0px' });
  secEls.forEach(s => io.observe(s));
  cleanupFns.push(()=>io.disconnect());

  const body = el.querySelector('#ch-body');
  const cta = document.createElement('div');
  cta.className = 'done-cta';
  const already = DONE.has(id);
  cta.innerHTML = `
    <h3>${already ? 'Chapter complete — gold tick in place.' : 'End of chapter — crystallize your tick.'}</h3>
    <p class="d">${already ? 'This site of your lattice is filled. ' + (ch.num<3 ? 'The drip continues with Chapter '+(ch.num+1)+'.' : 'Chapter 4 arrives '+CHAP.c4.rel+'.') : 'Your progress lattice gains a gold site (or just scroll to 80% — we will notice). Chime included.'}</p>
    <button class="btn btn-gold" ${already?'disabled':''} id="cta-btn">${already ? icon('check',13)+' COMPLETED · GOLD TICK IN PLACE' : icon('spark',13)+' MARK CHAPTER COMPLETE'}</button>`;
  body.appendChild(cta);
  cta.querySelector('#cta-btn')?.addEventListener('click', () => {
    if (DONE.has(id)) return;
    completeChapter(id);
  });
  const cm = document.createElement('div');
  cm.className = 'comments-mount';
  body.appendChild(cm);
  return el;
}

function viewLocked(ch){
  const el = frag(`
  <div class="wrap locked">
    <div class="kick" style="justify-content:center">SERIES 01 · CHAPTER ${String(ch.num).padStart(2,'0')} OF 07</div>
    <div class="lk">${icon('lock',22)}</div>
    <h1>${ch.title}</h1>
    <p style="color:var(--gold);font:500 11px 'IBM Plex Mono';letter-spacing:.12em;margin:14px 0 22px">RELEASES ${ch.rel.toUpperCase()} · ${ch.minutes} MIN · DRIPPED WEEKLY</p>
    <p class="ld">${ch.sub}</p>
    <ol>${ch.outline.map(o=>`<li>${o}</li>`).join('')}</ol>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px">
      <button class="btn btn-gold" id="notify">${icon('spark',13)} NOTIFY ME</button>
      <a class="btn" href="#/chapter/c1">${icon('arrow',13)} READ CH 1 MEANWHILE</a>
    </div>
    <p style="margin-top:26px;font:400 10px 'IBM Plex Mono';letter-spacing:.1em;color:var(--ink3)">PREREQS: CHAPTERS 1–${ch.num-1} · ${ch.mme.join(' · ')}</p>
  </div>`);
  el.querySelector('#notify').addEventListener('click', () => {
    toast(`Marked — Chapter ${ch.num} will arrive with a gold tick on ${ch.rel}.`);
  });
  return el;
}

/* ================================================================
   ROUTER
   ================================================================ */
function mountAll(el){
  el.querySelectorAll('.pg-mount').forEach(h => mountPlayground(h, h.dataset.pg));
  el.querySelectorAll('.diff-mount').forEach(h => mountDiff(h, h.dataset.diff));
  el.querySelectorAll('.scale-mount').forEach(h => mountScaling(h));
  el.querySelectorAll('.cp-mount').forEach(h => mountCheckpoint(h, h.dataset.cp));
  el.querySelectorAll('.comments-mount').forEach(h => mountComments(h, CUR_CH));
  el.querySelectorAll('.hero-lat canvas').forEach(cv => {
    const ctl = mountHeroLattice(cv);
    cleanupFns.push(ctl.stop);
    onEv(window, 'resize', ctl.relayout);
  });
}
function setActiveNav(){
  const h = location.hash;
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.remove('on'));
  if (h.startsWith('#/series/s1')) document.querySelector('[data-nav="s1"]')?.classList.add('on');
  else if (h === '#/' || h === '') document.querySelector('[data-nav="home"]')?.classList.add('on');
}
function route(){
  cleanupFns.forEach(f => f()); cleanupFns = [];
  closeModal();
  hideTip();
  $('#ch-progress').style.display = 'none';
  $('#ch-progress').style.width = '0';
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\//,'').split('/').filter(Boolean);
  let el;
  if (parts[0] === 'chapter' && CHAP[parts[1]]) el = viewChapter(parts[1]);
  else if (parts[0] === 'series') el = viewSeries(parts[1] || 's1');
  else el = viewHome();
  const app = $('#app');
  app.innerHTML = ''; app.appendChild(el);
  window.scrollTo(0,0);
  mountAll(el);
  try{ renderMathEl(el); }catch(e){}
  setActiveNav();
}
window.addEventListener('hashchange', route);
 $('#nav-gloss').addEventListener('click', e => { e.preventDefault(); openGlossary(); });
route();
</script>
